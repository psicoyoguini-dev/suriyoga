<style>
:root {

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; font-family: 'Inter', sans-serif; background-color: var(--arena); color: var(--gris); line-height: 1.7; }

h2 { font-size: 2rem; margin-bottom: 20px; }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 40px; }
.box { background-color: #ffffff; padding: 30px; border-radius: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.04); cursor: pointer; transition: transform 0.2s; }
.box:hover { transform: translateY(-5px); }
.program-detail { background-color: #fff; padding: 50px 30px; border-radius: 20px; margin-top: 50px; box-shadow: 0 10px 25px rgba(0,0,0,0.04); }
.subgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 30px; margin-top: 30px; }
.btn { display: inline-block; margin-top: 20px; padding: 14px 34px; background-color: var(--verde-oscuro); color: #fff; text-decoration: none; border-radius: 40px; font-size: 1rem; text-align: center; }
@media (max-width: 768px) { .subgrid { grid-template-columns: 1fr; } }
</style>
</head>
