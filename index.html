<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Suri Yoga | Habitar el cuerpo</title>
  <meta name="description" content="Yoga y mindfulness infantil y adolescente en Pilar. Espacio sin pantallas." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --arena: #f8f5f0;
      --salvia: #9caf88;
      --arcilla: #cfa58d;
      --gris: #3f3f3f;
      --verde-oscuro: #2f3e46;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--arena);
      color: var(--gris);
      line-height: 1.7;
    }

    header {
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-family: 'Playfair Display', serif;
      color: var(--verde-oscuro);
      font-size: 2rem;
    }

    section {
      padding: 70px 20px;
      max-width: 1000px;
      margin: auto;
    }

    h2, h3 {
      font-family: 'Playfair Display', serif;
      color: var(--verde-oscuro);
      font-weight: 500;
    }

    h2 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    h3 {
      font-size: 1.3rem;
    }

    p {
      font-size: 1.05rem;
    }

    /* HERO */
    .hero {
      text-align: center;
      padding: 90px 20px;
      background: linear-gradient(180deg, #ffffff, var(--arena));
    }

    .hero p {
      max-width: 700px;
      margin: auto;
    }

    .claim {
      font-size: 1.3rem;
      margin: 20px 0;
      color: var(--verde-oscuro);
    }

    .btn {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 34px;
      background-color: var(--verde-oscuro);
      color: #fff;
      text-decoration: none;
      border-radius: 40px;
      font-size: 1rem;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 40px;
    }

    .box {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.04);
    }
